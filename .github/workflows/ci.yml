# The three checks AGENTS.md asks for before a commit, on every PR and push to
# main, plus the clippy safety-lint baseline from the phase gate, and the Rust
# ones on Windows. Windows minutes bill 2x on a private
# repo, so that is one job without the frontend build (it is the same bundle
# on every OS), cached by rust-cache.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Tauri system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev pkg-config

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: pnpm build
        run: pnpm build
      # Needs dist from the build above, which the shell embeds.
      - name: clippy safety lints at or under the baseline
        run: .claude/skills/phase-gate/clippy-ratchet.sh
      - name: cargo test -p stowbox-core
        run: cargo test -p stowbox-core
      - name: cargo check --workspace
        run: cargo check --workspace

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # --show-output: a test that skips for a missing tool says so in the log.
      - name: cargo test -p stowbox-core
        run: cargo test -p stowbox-core -- --show-output
      # The shell embeds ../dist at compile time; an empty page is enough to
      # type-check it without building the frontend here.
      - name: Placeholder frontend
        shell: bash
        run: mkdir -p dist && echo '<!doctype html>' > dist/index.html
      - name: cargo check --workspace
        run: cargo check --workspace
