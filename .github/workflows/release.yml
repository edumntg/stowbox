# Installers for macOS, Linux and Windows. Runs only on a `v*` tag (draft
# GitHub release with the installers attached) or by hand from the Actions tab
# (installers attached to the run as artifacts, no release). Never on PRs or
# pushes: macOS minutes cost 10x and Windows 2x on a private repo.
# Signing is optional; see "Release builds" in README.md for the secrets.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-14
            args: --target universal-apple-darwin --bundles app,dmg
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            installers: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          # 22.04 rather than 24.04: the AppImage and deb link against the
          # runner's glibc, so the older one runs on more distributions.
          - os: ubuntu-22.04
            args: --bundles appimage,deb
            rust-targets: ""
            installers: |
              target/release/bundle/appimage/*.AppImage
              target/release/bundle/deb/*.deb
          - os: windows-2022
            args: --bundles msi,nsis
            rust-targets: ""
            installers: |
              target/release/bundle/msi/*.msi
              target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Tauri system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev pkg-config

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release

      # A secret that is not set still arrives as an empty variable, and the
      # Tauri bundler treats an empty APPLE_CERTIFICATE as a certificate to
      # import. Export only the ones that are set. Without a certificate the
      # app is ad-hoc signed ("-"): macOS then reports an unidentified
      # developer, which the user can allow, instead of a damaged download.
      - name: macOS signing secrets (optional)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!name}" ]; then
              { echo "$name<<__STOWBOX_EOF__"; echo "${!name}"; echo "__STOWBOX_EOF__"; } >> "$GITHUB_ENV"
              echo "$name: set"
            fi
          done
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            echo "No APPLE_CERTIFICATE: ad-hoc signing, no notarization"
          fi

      - name: Build installers
        uses: tauri-apps/tauri-action@action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          # On a tag, create (or reuse) a draft release and attach the
          # installers. By hand, tagName stays empty and nothing is released.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: Stowbox ${{ github.ref_name }}
          releaseBody: Unsigned build unless signing secrets are configured. See README for how to open it.
          releaseDraft: true
          prerelease: false

      - name: Attach installers to the run
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: stowbox-${{ runner.os }}
          path: ${{ matrix.installers }}
          if-no-files-found: error
          retention-days: 7
