[package]
name = "stowbox-core"
description = "Provider clients, agent protocol and cost math for Stowbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
tonic = { version = "0.14", default-features = false, features = ["transport", "channel", "codegen", "tls-ring", "tls-webpki-roots"] }
tonic-prost = "0.14"
prost = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "fs", "io-util", "net"] }
tokio-stream = "0.1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
thiserror = "2"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
getrandom = "0.2"
# boat.dev's command API has no stdin or TTY, so boat execs run over SSH.
# ring keeps one crypto backend with tonic's TLS.
russh = { version = "0.65", default-features = false, features = ["ring", "rsa"] }
# Agent37 boxes take SSH only through a WebSocket at its edge (wstunnel.rs).
# The same rustls and ring as reqwest and tonic.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
sha1 = "0.10"

[build-dependencies]
protox = "0.9.1"
tonic-prost-build = "0.14"
