# cargo deny check: what the dependency tree may contain. Run by the phase
# gate (.claude/skills/phase-gate/gate.sh).

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Permissive licences, plus MPL-2.0 (file-level copyleft, fine to link).
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]
confidence-threshold = 0.9

[licenses.private]
# The workspace's own crates are not published and carry no licence until
# the repository picks one.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The shell's path dependency on stowbox-core; both crates are unpublished.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
